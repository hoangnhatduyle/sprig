services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sprig
      POSTGRES_PASSWORD: sprig
      POSTGRES_DB: sprig
    ports:
      - "5432:5432"
    volumes:
      - sprig_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprig"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  sprig_postgres_data:
